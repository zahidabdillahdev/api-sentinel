services:
  api:
    ports: !reset []
    environment:
      APP_ORIGIN: https://${APP_DOMAIN:?APP_DOMAIN is required}
      TRUST_PROXY: "true"

  web:
    ports: !reset []
    build:
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/v1

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
